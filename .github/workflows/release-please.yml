name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Skip releases triggered by Dependabot commits (e.g. merged dependency bumps).
    if: ${{ github.event.head_commit.author.username != 'dependabot[bot]' }}
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
