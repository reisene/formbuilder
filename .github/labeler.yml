# actions/labeler v7 config (path-based labels for pull requests)
# Docs: https://github.com/actions/labeler

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '**/*.mdx'
          - 'src/content/**'

test:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.test.ts'
          - '**/*.test.tsx'
          - '**/*.spec.ts'
          - '**/*.spec.tsx'
          - '**/*.test.js'
          - '**/*.test.jsx'
          - '**/*.spec.js'
          - '**/*.spec.jsx'

source:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - 'pnpm-lock.yaml'
          - 'yarn.lock'
