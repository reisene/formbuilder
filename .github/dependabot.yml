version: 2
updates:
  # npm dependencies (Next.js, React, Bootstrap, ...) — grouped into a single PR
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    labels:
      - dependencies
    versioning-strategy: auto
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch

  # GitHub Actions — grouped into a single PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
