version: 2.1

orbs:
  codecov: codecov/codecov@6
  github-cli: circleci/github-cli@2.4.0

# ------------------------------------------------------------------
# Wymagane zmienne środowiskowe w ustawieniach projektu CircleCI:
#   CODECOV_TOKEN – token uploadu do Codecov (repo settings)
#   GH_TOKEN      – PAT GitHub z zakresem `repo` (labeler) oraz
#                   `security_events` (upload SARIF z CodeQL)
# ------------------------------------------------------------------

jobs:
  test:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: Run tests with coverage
          command: npm run test:coverage -- --pool=threads
      - codecov/upload

  codeql:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - restore_cache:
          keys:
            - codeql-bundle-v1-
      - run:
          name: Install CodeQL CLI
          command: |
            if [ ! -d codeql ]; then
              wget -q https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
              tar -xzf codeql-bundle-linux64.tar.gz
            fi
      - save_cache:
          key: codeql-bundle-v1-{{ .Branch }}
          paths:
            - ./codeql
      - run:
          name: Create CodeQL database
          command: |
            export PATH="$PWD/codeql:$PATH"
            codeql database create codeql-db \
              --language=javascript-typescript \
              --source-root=.
      - run:
          name: Run CodeQL analysis
          command: |
            export PATH="$PWD/codeql:$PATH"
            codeql database analyze codeql-db \
              --format=sarif-latest \
              --output=codeql-results.sarif
      - run:
          name: Upload SARIF to GitHub code scanning
          command: |
            if [ -z "$GH_TOKEN" ]; then
              echo "GH_TOKEN not set - skipping SARIF upload"
              exit 0
            fi
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/reisene/formbuilder/code-scanning/sarifs" \
              -d "{\"commit_sha\":\"$CIRCLE_SHA1\",\"ref\":\"refs/heads/$CIRCLE_BRANCH\",\"sarif\":\"$(base64 -w0 codeql-results.sarif)\"}"
      - store_artifacts:
          path: codeql-results.sarif
          destination: codeql-results.sarif

  label:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - github-cli/install
      - run:
          name: Label pull request from changed files
          command: |
            PR_URL="${CIRCLE_PULL_REQUEST:-}"
            if [ -z "$PR_URL" ]; then
              echo "Not a pull request - skipping"
              exit 0
            fi
            PR_NUMBER="${PR_URL##*/}"
            echo "Labeling PR #$PR_NUMBER"

            CHANGED="$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || true)"
            if [ -z "$CHANGED" ]; then
              CHANGED="$(gh api "repos/reisene/formbuilder/pulls/$PR_NUMBER/files" --jq '.[].filename' 2>/dev/null || true)"
            fi
            echo "Changed files:"
            echo "$CHANGED"

            LABELS=""
            if echo "$CHANGED" | grep -qE '(\.md$|\.mdx$|^src/content/)'; then LABELS="$LABELS documentation"; fi
            if echo "$CHANGED" | grep -qE '\.(test|spec)\.(ts|tsx|js|jsx)$'; then LABELS="$LABELS test"; fi
            if echo "$CHANGED" | grep -qE '^src/'; then LABELS="$LABELS source"; fi
            if echo "$CHANGED" | grep -qE '(package\.json$|package-lock\.json$|pnpm-lock\.yaml$|yarn\.lock$)'; then LABELS="$LABELS dependencies"; fi

            echo "Applying labels:${LABELS}"
            for L in $LABELS; do
              gh api -X POST "repos/reisene/formbuilder/issues/$PR_NUMBER/labels" \
                -f "labels[]=$L" >/dev/null 2>&1 || echo "Could not apply label '$L'"
            done

workflows:
  ci:
    jobs:
      - test
      - codeql
      - label
